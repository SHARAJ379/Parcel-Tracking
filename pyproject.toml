# Used by Vercel. Local installs use requirements.txt; a test keeps the two
# dependency lists identical.
[project]
name = "parcel-tracking"
version = "1.0.0"
description = "Parcel and Delivery Tracking Assistant (FastAPI + Gemini)"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.34",
    "pydantic==2.14.4",
    "supabase==2.34.1",
    "google-genai==3.6.1",
    "httpx2==2.16.2",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
]

[tool.vercel]
# Tells Vercel to load the variable "app" from app.py directly, instead of
# auto-detecting it (its detector failed to read app.py).
entrypoint = "app:app"
