{% extends "base.html" %}
{% block title %}API key created{% endblock %}
{% block content %}
<section class="key-created-layout">
  <div class="key-created-card">
    <h1>API key created</h1>
    <p>Copy this key now. It cannot be displayed again.</p>
    <label for="created-api-key">Key for {{ name }}</label>
    <div class="copy-field"><input id="created-api-key" value="{{ api_key }}" readonly><button type="button" class="button-secondary" data-copy-target="created-api-key">Copy key</button></div>
    <p class="copy-status" data-copy-status aria-live="polite"></p>
    <a class="return-link" href="/admin">Return to admin</a>
  </div>
</section>
{% endblock %}
