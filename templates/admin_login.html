{% extends "base.html" %}
{% block title %}Admin sign in{% endblock %}
{% block content %}
<section class="login-layout">
  <div class="login-card">
    <h1>Admin sign in</h1>
    <p>Sign in with your administrator username and password.</p>
    {% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/login" data-loading-form>
      <label for="username">Username
        <input id="username" name="username" value="{{ username or '' }}" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="100" required {% if not username %}autofocus{% endif %}>
      </label>
      <label for="password">Password
        <input id="password" name="password" type="password" autocomplete="current-password" required {% if username %}autofocus{% endif %}>
      </label>
      <button type="submit"><span class="button-label">Sign in</span><span class="button-loading" hidden>Signing in…</span></button>
    </form>
  </div>
</section>
{% endblock %}
