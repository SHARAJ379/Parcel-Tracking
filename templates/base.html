<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Parcel tracking and delivery assistant.">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Parcel Tracking{% endblock %} · Parcel Tracking</title>
  {# Apply the saved theme before the page paints, so there is no flash. #}
  <script>try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=JetBrains+Mono:wght@400..600&family=Noto+Sans+Devanagari:wght@400..700&family=Noto+Sans+Kannada:wght@400..700&family=Noto+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Parcel Tracking</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Assistant</a>
        <a href="/docs-guide" {% if request.url.path == "/docs-guide" %}aria-current="page"{% endif %}>API guide</a>
        <a href="/admin" {% if request.url.path.startswith("/admin") %}aria-current="page"{% endif %}>Admin</a>
      </nav>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch colour theme">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>
  <main id="main-content" class="site-main {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <span>Parcel Tracking</span>
      <span class="footer-links"><a href="/docs-guide">API guide</a><a href="/docs">API reference</a></span>
    </div>
  </footer>
</body>
</html>
